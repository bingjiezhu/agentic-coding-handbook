<text x="156" y="96" fill="#1C1B19" font-size="28" font-weight="500" text-anchor="middle" class="" data-node="n0">固定审查对象</text>
<text x="156" y="134" fill="#6E675F" font-size="24" font-weight="400" text-anchor="middle" class="" data-node="n0">原要求·当前版本</text>
<text x="36" y="33" fill="#6E675F" font-size="24" font-weight="400" text-anchor="start" class="number">01</text>
</g>
<g data-node-group="n1" data-x="320" data-y="48" data-w="264" data-h="104">
<rect x="320" y="48" width="264" height="104" rx="6" fill="#E9D3C4" stroke="#B4532A" stroke-width="2"/>
<text x="452" y="96" fill="#B4532A" font-size="28" font-weight="500" text-anchor="middle" class="" data-node="n1">独立检查</text>
<text x="452" y="134" fill="#6E675F" font-size="24" font-weight="400" text-anchor="middle" class="" data-node="n1">直接读取与运行</text>
<text x="332" y="33" fill="#6E675F" font-size="24" font-weight="400" text-anchor="start" class="number">02</text>
</g>
<g data-node-group="n2" data-x="616" data-y="48" data-w="264" data-h="104">
<rect x="616" y="48" width="264" height="104" rx="6" fill="#F3EDE3" stroke="#CBC1B2" stroke-width="1.5"/>
<text x="748" y="96" fill="#1C1B19" font-size="28" font-weight="500" text-anchor="middle" class="" data-node="n2">逐项核对修复</text>
<text x="748" y="134" fill="#6E675F" font-size="24" font-weight="400" text-anchor="middle" class="" data-node="n2">明确问题和证据</text>
<text x="628" y="33" fill="#6E675F" font-size="24" font-weight="400" text-anchor="start" class="number">03</text>
</g>
<g data-node-group="n3" data-x="912" data-y="48" data-w="264" data-h="104">
<rect x="912" y="48" width="264" height="104" rx="6" fill="#F3EDE3" stroke="#1C1B19" stroke-width="1.5"/>
<text x="1044" y="96" fill="#1C1B19" font-size="28" font-weight="500" text-anchor="middle" class="" data-node="n3">再次验证</text>
<text x="1044" y="134" fill="#6E675F" font-size="24" font-weight="400" text-anchor="middle" class="" data-node="n3">修复与相关影响</text>
<text x="924" y="33" fill="#6E675F" font-size="24" font-weight="400" text-anchor="start" class="number">04</text>
