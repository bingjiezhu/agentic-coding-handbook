<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="244" viewBox="0 0 1200 244" role="img" aria-labelledby="p_review-title p_review-desc">
<title id="p_review-title">独立审查与复核</title><desc id="p_review-desc">独立审查与复核：固定审查对象、独立检查、逐项核对修复、再次验证。</desc>
<style>text{font-family:"Noto Sans CJK SC","PingFang SC",sans-serif}.number{font-family:"Menlo",monospace}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#6E675F"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#B4532A"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#6E675F"/></marker></defs>
<rect width="1200" height="244" fill="#F3EDE3"/>
<path data-edge="n0-n1" d="M 288,100 L 320,100" fill="none" stroke="#6E675F" stroke-width="2.2" marker-end="url(#arrow)"/>
<path data-edge="n1-n2" d="M 584,100 L 616,100" fill="none" stroke="#6E675F" stroke-width="2.2" marker-end="url(#arrow)"/>
<path data-edge="n2-n3" d="M 880,100 L 912,100" fill="none" stroke="#6E675F" stroke-width="2.2" marker-end="url(#arrow)"/>
<g data-node-group="n0" data-x="24" data-y="48" data-w="264" data-h="104">
